# .github/workflows/deploy-pages.yml
#
# Deploys the full set of dashboard files to GitHub Pages.
#
# WHY THIS EXISTS
# ───────────────
# The mosaic-lims-dashboards repo stores every run's output under dated folders
# (YYYY-MM-DD/morning|afternoon|evening/...) AND mirrors the latest run to
# top-level live folders (defect-dashboard/, test-execution-dashboard/).
#
# The old branch-based Pages deployment timed out because it tried to upload
# the entire repo as a single git-based artifact via the legacy CDN path.
#
# This workflow builds an explicit _site/ directory and uses the modern
# actions/upload-pages-artifact + actions/deploy-pages approach, which
# is fast and reliable regardless of repo size.
#
# _site/ contains:
#   index.html                                  ← landing page
#   defect-dashboard/...                        ← live (latest) dashboards
#   test-execution-dashboard/...               ← live (latest) dashboards
#   YYYY-MM-DD/slot/defect-dashboard/...       ← all dated archives (historical links)
#   YYYY-MM-DD/slot/test-execution-dashboard/... ← all dated archives
#
# TRIGGER
# ───────
# Runs on every push to main that touches any dashboard file or archive folder.
# Can also be triggered manually from the Actions tab.

name: Deploy dashboards to Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'defect-dashboard/**'
      - 'test-execution-dashboard/**'
      - '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/**'
  workflow_dispatch:   # allow manual re-run from the Actions tab

# Allow only one Pages deployment at a time; cancel any in-flight run
# so a rapid sequence of ADO commits doesn't queue up multiple deploys.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages:    write
  id-token: write

jobs:
  build:
    name: Assemble _site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble site directory
        run: |
          mkdir -p _site/defect-dashboard
          mkdir -p _site/test-execution-dashboard

          # Root landing page
          cp index.html _site/index.html

          # Live (latest) defect dashboards
          cp defect-dashboard/*.html _site/defect-dashboard/

          # Live (latest) test-execution dashboards (preserve subdirectory structure)
          cp -r test-execution-dashboard/. _site/test-execution-dashboard/

          # Dated archive folders — copy every YYYY-MM-DD/ directory so that
          # historical wiki links (e.g. /2026-08-29/morning/defect-dashboard/...)
          # continue to resolve correctly on GitHub Pages.
          for dir in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "_site/$dir"
            fi
          done

          # Suppress Jekyll processing
          touch _site/.nojekyll

          echo "── _site summary ────────────────────────────────────"
          find _site -maxdepth 3 -type d | sort
          echo "── file count ───────────────────────────────────────"
          find _site -type f | wc -l
          echo "── total size ───────────────────────────────────────"
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
